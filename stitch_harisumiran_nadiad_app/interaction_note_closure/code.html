<!DOCTYPE html>

<html lang="en"><head>

                    },

<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .liquid-glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .sheet-handle {
            width: 36px;
            height: 5px;
            background-color: #E8E0D8;
            border-radius: 2.5px;
            margin: 8px auto;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col justify-end antialiased">
<!-- Dimmed Background Overlay -->
<div class="fixed inset-0 bg-on-surface/20 z-0 backdrop-blur-sm"></div>
<!-- Sheet Container -->
<div class="bg-surface-container-lowest w-full rounded-t-[32px] shadow-[0_-8px_30px_rgba(36,33,31,0.08)] z-10 relative flex flex-col max-h-[795px] md:max-w-[600px] md:mx-auto mt-20 pb-safe">
<!-- Handle -->
<div class="sheet-handle"></div>
<!-- Header -->
<header class="flex items-center justify-between px-margin-main py-unit border-b border-surface-variant/50">
<button aria-label="Close" class="h-touch-target-min flex items-center justify-center text-primary">
<span class="material-symbols-outlined font-[300]">close</span>
</button>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary font-[300]" style="font-variation-settings: 'FILL' 1;">lock</span>
<h1 class="font-headline-md text-headline-md text-on-surface">Confidential Note</h1>
</div>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<!-- Content Area -->
<main class="flex-1 overflow-y-auto px-margin-main py-stack-gap">
<!-- Warning Banner -->
<div class="bg-surface-variant/40 rounded-xl p-4 mb-6 flex items-start gap-3 border border-outline-variant/30">
<span class="material-symbols-outlined text-on-surface-variant mt-0.5">info</span>
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-1">Restricted Access</p>
<p class="font-body-sm text-body-sm text-on-surface">This note will only be visible to you and assigned supervisors. It will not appear in the family's general history.</p>
</div>
</div>
<form class="space-y-6">
<!-- Text Area -->
<div class="space-y-2">
<label class="block font-label-sm text-label-sm text-on-surface-variant" for="confidential-note">Interaction Details</label>
<div class="relative bg-white rounded-xl border border-surface-variant shadow-sm focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all">
<textarea class="w-full bg-transparent border-none outline-none focus:ring-0 p-4 font-body-md text-body-md text-on-surface resize-none placeholder-on-surface-variant/40" id="confidential-note" placeholder="Enter confidential details regarding the interaction..." rows="6"></textarea>
</div>
</div>
<!-- Next Action Date -->
<div class="space-y-2">
<label class="block font-label-sm text-label-sm text-on-surface-variant">Next Action Required</label>
<button class="w-full bg-white rounded-xl border border-surface-variant p-4 flex items-center justify-between shadow-sm active:scale-[0.98] transition-transform" type="button">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary">calendar_month</span>
<span class="font-body-md text-body-md text-on-surface">Select Date</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</button>
</div>
<!-- Escalate Toggle -->
<div class="bg-white rounded-xl border border-surface-variant p-4 flex items-center justify-between shadow-sm">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-error">notification_important</span>
<div>
<span class="block font-body-md text-body-md text-on-surface font-medium">Escalate to Supervisor</span>
<span class="block font-label-sm text-label-sm text-on-surface-variant">Flag this note for immediate review</span>
</div>
</div>
<!-- Toggle Switch -->
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
</form>
<div class="h-8"></div> <!-- Bottom padding -->
</main>
<!-- Footer Actions -->
<footer class="p-margin-main bg-surface-container-lowest border-t border-surface-variant/50 space-y-3 pb-8">
<button class="w-full bg-primary text-on-primary rounded-full h-12 font-headline-md text-body-lg flex items-center justify-center shadow-sm active:scale-[0.98] transition-transform">
                Request Closure
            </button>
<button class="w-full bg-surface-container text-primary rounded-full h-12 font-headline-md text-body-lg flex items-center justify-center active:scale-[0.98] transition-transform">
                Save Note
            </button>
</footer>
</div>
</body></html>
