<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Live Attendance - HariSumiran</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                extend: {
                    colors: {
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed-dim": "#96d4b2",

                        "surface-container": "#f4ece9",

                        "on-secondary": "#ffffff",
                        "tertiary-fixed-dim": "#98cbff",
                        "primary-fixed-dim": "#ffb597",
                        "secondary-fixed": "#b1f0cd",
                        "inverse-on-surface": "#f7efec",
                        "surface-variant": "#e8e1dd",
                        "on-surface-variant": "#57423a",
                        "on-tertiary": "#ffffff",
                        "surface-dim": "#e0d9d5",
                        "primary-fixed": "#ffdbcd",
                        "on-surface": "#1e1b19",
                        "on-primary-fixed": "#360f00",
                        "on-tertiary-fixed": "#001d33",
                        "background": "#fff8f5",

                        "on-tertiary-container": "#eaf2ff",
                        "on-background": "#1e1b19",
                        "surface-container-high": "#eee7e3",
                        "inverse-surface": "#33302e",
                        "on-error": "#ffffff",
                        "error-container": "#ffdad6",
                        "surface-container-highest": "#e8e1dd",
                        "tertiary-container": "#3c72a1",
                        "on-tertiary-fixed-variant": "#024a77",
                        "surface-container-low": "#faf2ee",
                        "surface-bright": "#fff8f5",
                        "error": "#ba1a1a",
                        "secondary": "#2d694d",
                        "outline-variant": "#dec0b5",
                        "on-error-container": "#93000a",
                        "inverse-primary": "#ffb597",
                        "on-secondary-fixed-variant": "#105137",
                        "on-primary": "#ffffff",
                        "surface-tint": "#a33e05",
                        "outline": "#8b7268",
                        "on-primary-fixed-variant": "#7e2c00",
                        "on-secondary-container": "#326e51",
                        "primary": "#963700",
                        "on-primary-container": "#ffeee9",
                        "tertiary-fixed": "#cfe5ff",

                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "touch-target-min": "44px",
                        "unit": "8px",
                        "stack-gap": "12px",
                        "margin-main": "20px",
                        "gutter": "16px"
                    },
                    fontFamily: {
                        "gujarati-body": ["Noto Sans"],
                        "body-md": ["Inter"],
                        "nav-large-title": ["Plus Jakarta Sans"],

                    fontSize: {

                }
            }
        }

<style>
        .scanner-line {
            animation: scan 2s linear infinite;
        }
        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        .toast-enter {
            animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translate(-50%, 20px) scale(0.95); }
            100% { opacity: 1; transform: translate(-50%, 0) scale(1); }
        }
        .corner-border {
            position: absolute;
            width: 32px;
            height: 32px;
            border-color: #b84d17; /* primary-container */
            border-width: 4px;
        }
        .corner-tl { top: 0; left: 0; border-right: none; border-bottom: none; border-radius: 16px 0 0 0; }
        .corner-tr { top: 0; right: 0; border-left: none; border-bottom: none; border-radius: 0 16px 0 0; }
        .corner-bl { bottom: 0; left: 0; border-right: none; border-top: none; border-radius: 0 0 0 16px; }
        .corner-br { bottom: 0; right: 0; border-left: none; border-top: none; border-radius: 0 0 16px 0; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-black text-on-surface h-screen w-screen overflow-hidden relative font-body-md text-body-md">
<!-- Camera Feed Background (Simulated) -->
<div class="absolute inset-0 bg-cover bg-center opacity-80" data-alt="A slightly blurred, real-time camera feed perspective looking at a group of volunteers in a brightly lit, serene temple hall. The background features warm, natural lighting and soft focus on architectural pillars, simulating a live smartphone camera view scanning for a QR code." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBxKSRNT9o5Km47g8BTk0A2hFxpWBJ3MNx0KdN05tSh30IqOwIVCQkGZJAhZTL3_aQAFthbdHB7o0oXUU15czGvecQebHLH3KwNFVxgQA2tLnddt-nX2GlmsV0wshhYLKfQ231nFry3oNm54iiiqqhh7qCRUmIbi6gTu0isxzKoEaFMZCd-JyNjNnGTWjjHZA8DWGzQNOa6DOSgZWZ7cL7n0LsVihJgklIJzbPVxuagnOxFkoYAMo8k')">
</div>
<!-- Dark overlay for better contrast around the scanning area -->
<div class="absolute inset-0 bg-black/30 pointer-events-none"></div>
<!-- Liquid Glass Top Header -->
<div class="absolute top-0 left-0 w-full z-40 bg-surface/80 backdrop-blur-2xl border-b border-white/20 pt-12 pb-4 px-margin-main flex flex-col gap-stack-gap">
<!-- Top row: Back & Count -->
<div class="flex items-center justify-between w-full h-touch-target-min">
<button aria-label="Go back" class="flex items-center justify-center w-touch-target-min h-touch-target-min rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-surface" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<span class="font-headline-md text-headline-md text-on-surface">12 / 45 Present</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Sabha Session</span>
</div>
<div class="w-touch-target-min"></div> <!-- Spacer for centering -->
</div>
<!-- Segmented Control -->
<div class="bg-surface-variant/50 backdrop-blur-md rounded-full p-1 flex items-center relative h-12 mt-2">
<button class="flex-1 h-full rounded-full flex items-center justify-center font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-colors gap-2">
<span class="material-symbols-outlined text-[18px]" data-icon="search">search</span>
                Search
            </button>
<button class="flex-1 h-full rounded-full flex items-center justify-center font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-colors gap-2">
<span class="material-symbols-outlined text-[18px]" data-icon="list">list</span>
                List
            </button>
<button class="flex-1 h-full rounded-full bg-white shadow-sm flex items-center justify-center font-label-sm text-label-sm text-primary gap-2 transition-all">
<span class="material-symbols-outlined text-[18px]" data-icon="qr_code_scanner" style="font-variation-settings: 'FILL' 1;">qr_code_scanner</span>
                QR
            </button>
</div>
</div>
<!-- Center Scanner Viewfinder -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-[280px] h-[280px] z-30">
<!-- Frame cutout simulation (dark edges, clear center handled by background overlay above) -->
<!-- Corner brackets -->
<div class="corner-border corner-tl"></div>
<div class="corner-border corner-tr"></div>
<div class="corner-border corner-bl"></div>
<div class="corner-border corner-br"></div>
<!-- Scanning Line -->
<div class="absolute left-0 w-full h-[2px] bg-primary-container shadow-[0_0_8px_rgba(184,77,23,0.8)] scanner-line"></div>
</div>
<!-- Instructional Text -->
<div class="absolute top-[65%] left-1/2 transform -translate-x-1/2 text-center w-full px-margin-main z-30">
<p class="font-body-md text-body-md text-white drop-shadow-md">Align QR code within the frame to scan</p>
</div>
<!-- Haptic Success Toast -->
<div class="absolute top-[75%] left-1/2 transform -translate-x-1/2 z-50 toast-enter">
<div class="bg-secondary/90 backdrop-blur-xl px-6 py-3 rounded-full flex items-center gap-3 shadow-lg border border-secondary-fixed/30">
<span class="material-symbols-outlined text-on-secondary" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-sm text-label-sm text-on-secondary whitespace-nowrap">Verified: Amit Shah</span>
</div>
</div>
<!-- Liquid Glass Bottom Footer -->
<div class="absolute bottom-0 left-0 w-full z-40 bg-surface/80 backdrop-blur-2xl border-t border-white/20 pt-4 pb-8 px-margin-main flex justify-center">
<button class="w-full max-w-md bg-primary hover:bg-primary/90 active:scale-95 transition-all duration-200 text-on-primary h-[56px] rounded-full flex items-center justify-center gap-2 shadow-sm">
<span class="font-label-sm text-label-sm">Complete Session</span>
<span class="material-symbols-outlined text-[20px]" data-icon="task_alt">task_alt</span>
</button>
</div>
<script>
        // Micro-interaction: Simulate scanning sound/haptic (conceptual)
        // In a real app, this would trigger native haptics on successful read.
        setTimeout(() => {
            const toast = document.querySelector('.toast-enter');
            // Re-trigger animation to simulate multiple scans
            toast.style.animation = 'none';
            toast.offsetHeight; // Trigger reflow
            toast.style.animation = null;
        }, 3000);
    </script>
</body></html>
