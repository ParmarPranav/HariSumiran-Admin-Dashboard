<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Export Confirmation</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&amp;family=Inter:wght@400;500&amp;family=Noto+Sans:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface-variant": "#57423a",
                        "outline-variant": "#dec0b5",
                        "surface-container-low": "#faf2ee",
                        "on-tertiary": "#ffffff",
                        "surface-variant": "#e8e1dd",
                        "surface-container-high": "#eee7e3",
                        "secondary-container": "#aeedca",
                        "inverse-surface": "#33302e",
                        "on-background": "#1e1b19",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed-variant": "#024a77",
                        "on-primary-fixed": "#360f00",
                        "error": "#ba1a1a",
                        "tertiary-container": "#3c72a1",
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed": "#001d33",
                        "primary-container": "#b84d17",
                        "on-secondary-container": "#326e51",
                        "error-container": "#ffdad6",
                        "background": "#fff8f5",
                        "surface-bright": "#fff8f5",
                        "on-secondary-fixed-variant": "#105137",
                        "tertiary-fixed-dim": "#98cbff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container": "#f4ece9",
                        "secondary-fixed-dim": "#96d4b2",
                        "on-surface": "#1e1b19",
                        "primary-fixed": "#ffdbcd",
                        "surface": "#fff8f5",
                        "secondary-fixed": "#b1f0cd",
                        "on-primary": "#ffffff",
                        "primary": "#963700",
                        "outline": "#8b7268",
                        "inverse-on-surface": "#f7efec",
                        "on-secondary-fixed": "#002113",
                        "on-tertiary-container": "#eaf2ff",
                        "secondary": "#2d694d",
                        "on-primary-container": "#ffeee9",
                        "surface-container-highest": "#e8e1dd",
                        "tertiary-fixed": "#cfe5ff",
                        "surface-dim": "#e0d9d5",
                        "on-primary-fixed-variant": "#7e2c00",
                        "primary-fixed-dim": "#ffb597",
                        "surface-tint": "#a33e05",
                        "on-error-container": "#93000a",
                        "tertiary": "#1f5987",
                        "inverse-primary": "#ffb597"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-gap": "12px",
                        "touch-target-min": "44px",
                        "gutter": "16px",
                        "margin-main": "20px",
                        "unit": "8px"
                    },
                    "fontFamily": {
                        "branding-header": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "gujarati-body": ["Noto Sans"],
                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "nav-large-title": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "branding-header": ["22px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-md": ["20px", { "lineHeight": "25px", "fontWeight": "600" }],
                        "gujarati-body": ["17px", { "lineHeight": "26px", "fontWeight": "400" }],
                        "body-lg": ["17px", { "lineHeight": "22px", "fontWeight": "400" }],
                        "label-sm": ["13px", { "lineHeight": "18px", "letterSpacing": "0.2pt", "fontWeight": "500" }],
                        "body-md": ["15px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "nav-large-title": ["34px", { "lineHeight": "41px", "letterSpacing": "-0.4pt", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1;
        }
        /* Bottom Sheet Animation */
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-slide-up {
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        
        /* Glassmorphism utility */
        .glass-sheet {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 -8px 32px rgba(36, 33, 31, 0.08);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen relative overflow-hidden font-body-md text-on-surface antialiased">
<!-- Mock Background App Screen (Report View) -->
<div class="absolute inset-0 z-0">
<!-- Top App Bar Mockup -->
<header class="fixed top-0 w-full z-10 bg-surface/80 backdrop-blur-xl border-b border-outline-variant/30 px-margin-main h-touch-target-min flex justify-between items-center">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary">Follow-up &amp; Wellbeing</h1>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary">ios_share</span>
</div>
</header>
<!-- Dummy Content -->
<div class="pt-24 px-margin-main space-y-6 opacity-40">
<div class="space-y-2">
<h2 class="font-nav-large-title text-nav-large-title text-on-surface">Weekly Overview</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Sensitive report for region A2.</p>
</div>
<div class="bg-surface-container rounded-xl p-4 space-y-4">
<div class="h-4 bg-outline-variant/30 rounded w-3/4"></div>
<div class="h-4 bg-outline-variant/30 rounded w-full"></div>
<div class="h-4 bg-outline-variant/30 rounded w-5/6"></div>
</div>
<div class="bg-surface-container rounded-xl p-4 space-y-4">
<div class="h-4 bg-outline-variant/30 rounded w-full"></div>
<div class="h-4 bg-outline-variant/30 rounded w-2/3"></div>
</div>
</div>
</div>
<!-- Overlay Dimming Background -->
<div aria-hidden="true" class="fixed inset-0 bg-inverse-surface/40 backdrop-blur-[2px] z-40 animate-fade-in"></div>
<!-- Native iOS Style Bottom Sheet -->
<div class="fixed inset-x-0 bottom-0 z-50 flex flex-col justify-end pointer-events-none h-full">
<div class="glass-sheet w-full rounded-t-[32px] pointer-events-auto flex flex-col animate-slide-up pb-8">
<!-- Drag Handle -->
<div class="w-full flex justify-center pt-4 pb-2">
<div class="w-12 h-1.5 bg-outline-variant rounded-full"></div>
</div>
<!-- Sheet Header -->
<div class="px-margin-main pb-4 border-b border-outline-variant/20 flex justify-between items-center">
<h2 class="font-headline-md text-headline-md text-on-surface">Export Configuration</h2>
<button class="w-touch-target-min h-touch-target-min flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors bg-surface-container-highest/50 rounded-full">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Sheet Content -->
<div class="px-margin-main py-6 space-y-6 overflow-y-auto max-h-[618px]">
<!-- Security Warning -->
<div class="bg-error-container/50 border border-error/20 rounded-xl p-4 flex gap-3 items-start">
<span class="material-symbols-outlined text-error icon-fill mt-0.5">policy</span>
<div>
<p class="font-label-sm text-label-sm text-error uppercase tracking-wider mb-1">Security Audit Active</p>
<p class="font-body-md text-body-md text-on-error-container">This export is logged and tied to your administrator ID. Unauthorized sharing of sensitive data is restricted.</p>
</div>
</div>
<!-- Export Options (Checkboxes) -->
<div class="space-y-4">
<h3 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider pl-1">Data Inclusion</h3>
<div class="bg-surface-container-lowest border border-outline-variant/30 rounded-xl overflow-hidden shadow-sm">
<!-- Option 1 -->
<label class="flex items-center justify-between p-4 border-b border-outline-variant/20 hover:bg-surface-container/50 transition-colors cursor-pointer">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-tertiary">lock_open</span>
<div>
<span class="block font-body-md text-body-md text-on-surface">Include Confidential Notes</span>
<span class="block font-label-sm text-label-sm text-on-surface-variant">Includes private wellbeing assessments</span>
</div>
</div>
<div class="relative flex items-center justify-center w-6 h-6">
<input class="peer sr-only" type="checkbox"/>
<div class="w-6 h-6 border-2 border-outline rounded flex items-center justify-center peer-checked:bg-primary peer-checked:border-primary transition-all">
<span class="material-symbols-outlined text-on-primary text-[16px] opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
</div>
</label>
<!-- Option 2 -->
<label class="flex items-center justify-between p-4 border-b border-outline-variant/20 hover:bg-surface-container/50 transition-colors cursor-pointer">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary">group</span>
<div>
<span class="block font-body-md text-body-md text-on-surface">Include Karyakarta Details</span>
<span class="block font-label-sm text-label-sm text-on-surface-variant">Contact info and assignment history</span>
</div>
</div>
<div class="relative flex items-center justify-center w-6 h-6">
<input checked="" class="peer sr-only" type="checkbox"/>
<div class="w-6 h-6 border-2 border-outline rounded flex items-center justify-center peer-checked:bg-primary peer-checked:border-primary transition-all">
<span class="material-symbols-outlined text-on-primary text-[16px] opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
</div>
</label>
<!-- Option 3 (PDF) -->
<label class="flex items-center justify-between p-4 hover:bg-surface-container/50 transition-colors cursor-pointer">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary">picture_as_pdf</span>
<div>
<span class="block font-body-md text-body-md text-on-surface">PDF Format</span>
<span class="block font-label-sm text-label-sm text-on-surface-variant">Recommended for printing</span>
</div>
</div>
<div class="relative flex items-center justify-center w-6 h-6">
<input checked="" class="peer sr-only" type="checkbox"/>
<div class="w-6 h-6 border-2 border-outline rounded flex items-center justify-center peer-checked:bg-primary peer-checked:border-primary transition-all">
<span class="material-symbols-outlined text-on-primary text-[16px] opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
</div>
</label>
</div>
</div>
<!-- Reason Text Field -->
<div class="space-y-2">
<label class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider pl-1" for="export-reason">Reason for Export <span class="text-error">*</span></label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded-xl p-3 font-body-md text-body-md text-on-surface placeholder:text-outline resize-none shadow-sm transition-all" id="export-reason" placeholder="Please state the purpose for this data extraction..." rows="3"></textarea>
</div>
</div>
<!-- Footer Actions -->
<div class="px-margin-main pt-2 pb-4 mt-auto">
<button class="w-full h-14 bg-primary hover:bg-primary/90 text-on-primary font-headline-md text-headline-md rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-primary/20 transition-all active:scale-[0.98]">
<span class="material-symbols-outlined icon-fill">lock</span>
                    Generate Secure Export
                </button>
</div>
</div>
</div>
</body></html>
