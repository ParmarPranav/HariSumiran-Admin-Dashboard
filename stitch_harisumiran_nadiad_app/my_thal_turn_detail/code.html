<!DOCTYPE html>

<html class="light" lang="en"><head>

<style>
        /* Level 0 Watermark */
        .bg-watermark {
            background-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="40" fill="none" stroke="%23963700" stroke-width="2" opacity="0.05"/></svg>');
            background-position: center;
            background-repeat: no-repeat;
            background-size: 80%;
        }
        
        /* Level 1 Shadows */
        .shadow-level-1 {
            box-shadow: 0 4px 12px rgba(36, 33, 31, 0.04);
        }

        /* Glassmorphism */
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /* Interactive touch */
        .touch-target {
            min-height: 44px;
            min-width: 44px;
        }
        .active-scale:active {
            transform: scale(0.98);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen font-body-md antialiased pb-24 md:pb-0 relative bg-watermark">
<!-- Top Navigation (Task-Focused: Suppressing Main Global Nav, Using Modal/Detail Header) -->
<header class="fixed top-0 w-full z-50 bg-surface/80 dark:bg-surface/80 backdrop-blur-xl border-b border-outline-variant/30 dark:border-outline/20">
<div class="flex justify-between items-center px-margin-main h-touch-target-min w-full">
<button class="text-primary dark:text-primary-fixed-dim hover:opacity-80 transition-opacity flex items-center justify-center touch-target">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back_ios</span>
</button>
<div class="font-headline-md text-headline-md text-on-surface">Your Thal Turn</div>
<button class="text-primary dark:text-primary-fixed-dim hover:opacity-80 transition-opacity flex items-center justify-center touch-target">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">more_horiz</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-[80px] px-margin-main max-w-[720px] mx-auto pb-12">
<!-- Large Title Area (Scroll Transition Placeholder) -->
<div class="mb-stack-gap">
<h1 class="font-nav-large-title text-nav-large-title text-on-surface">Thal Detail</h1>
</div>
<!-- Bento Grid Layout for Details -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-gap">
<!-- Date & Time Card -->
<div class="bg-surface-container-lowest rounded-xl p-4 border border-outline-variant/30 shadow-level-1 flex flex-col justify-between">
<div class="flex items-center gap-2 mb-4 text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">calendar_month</span>
<h2 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wide">Date</h2>
</div>
<div>
<div class="font-headline-md text-headline-md text-on-surface">Nov 15</div>
<div class="font-body-md text-body-md text-on-surface-variant">Friday</div>
</div>
</div>
<!-- Meal Type Card -->
<div class="bg-surface-container-lowest rounded-xl p-4 border border-outline-variant/30 shadow-level-1 flex flex-col justify-between">
<div class="flex items-center gap-2 mb-4 text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">restaurant</span>
<h2 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wide">Meal</h2>
</div>
<div>
<div class="font-headline-md text-headline-md text-on-surface">Evening Prasad</div>
<div class="font-body-md text-body-md text-on-surface-variant">Dinner Service</div>
</div>
</div>
<!-- Headcount Card (Full Width on Mobile, Half on Desktop) -->
<div class="bg-surface-container-lowest rounded-xl p-4 border border-outline-variant/30 shadow-level-1 flex items-center justify-between md:col-span-2">
<div class="flex items-center gap-3 text-primary">
<div class="bg-primary/10 p-2 rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">group</span>
</div>
<div>
<h2 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wide">Expected Headcount</h2>
<div class="font-headline-md text-headline-md text-on-surface">150</div>
</div>
</div>
</div>
<!-- Instructions Card -->
<div class="bg-surface-container-lowest rounded-xl p-4 border border-outline-variant/30 shadow-level-1 md:col-span-2">
<div class="flex items-center gap-2 mb-2 text-on-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">info</span>
<h2 class="font-label-sm text-label-sm uppercase tracking-wide">Special Instructions</h2>
</div>
<div class="bg-surface-container-low p-3 rounded-lg border border-outline-variant/50">
<p class="font-body-md text-body-md text-on-surface">Low spice requested. Ensure enough mild options are available for the elders.</p>
</div>
</div>
<!-- Swap Status Banner (Conditional rendering example) -->
<div class="bg-surface-container-lowest rounded-xl p-4 border border-outline-variant/30 shadow-level-1 md:col-span-2 flex items-center gap-3">
<div class="bg-outline/10 p-2 rounded-full text-outline">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">swap_horiz</span>
</div>
<div class="flex-1">
<h2 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wide">Swap Status</h2>
<div class="font-body-md text-body-md text-on-surface flex items-center gap-2">
                        Pending Request
                        <span class="w-2 h-2 rounded-full bg-outline animate-pulse"></span>
</div>
</div>
</div>
</div>
<!-- Primary Actions Group -->
<div class="mt-8 flex flex-col gap-3">
<button class="bg-primary text-on-primary font-headline-md text-headline-md rounded-xl py-3 w-full active-scale transition-transform shadow-md touch-target flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                Confirm Turn
            </button>
<button class="bg-transparent border border-outline text-on-surface font-body-md text-body-md rounded-xl py-3 w-full active-scale transition-transform touch-target flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">cancel</span>
                Decline / Swap
            </button>
</div>
</main>
<!-- Suppressed BottomNavBar due to Task-Focused intent (Detail Screen) -->
</body></html>
