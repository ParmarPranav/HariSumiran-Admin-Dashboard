<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.otp-input');
            const verifyBtn = document.getElementById('verifyBtn');
            const verifySpinner = document.getElementById('verifySpinner');
            const timerDisplay = document.getElementById('timerDisplay');
            
            // Auto-focus logic and formatting
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    // Restrict to single digit
                    if (e.target.value.length > 1) {
                        e.target.value = e.target.value.slice(0, 1);
                    }
                    
                    // Move to next input
                    if (e.target.value.length === 1 && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                    
                    checkCompletion();
                });

                input.addEventListener('keydown', (e) => {
                    // Move to previous on backspace if current is empty
                    if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                        inputs[index - 1].focus();
                        inputs[index - 1].value = '';
                    }
                });
                
                // Handle paste (Autofill support)
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pastedData = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, 6);
                    if (pastedData) {
                        for (let i = 0; i < pastedData.length && i < inputs.length; i++) {
                            inputs[i].value = pastedData[i];
                        }
                        const nextFocusIndex = Math.min(pastedData.length, inputs.length - 1);
                        inputs[nextFocusIndex].focus();
                        checkCompletion();
                    }
                });
            });

            function checkCompletion() {
                const isComplete = Array.from(inputs).every(input => input.value.length === 1);
                if (isComplete) {
                    verifyBtn.removeAttribute('disabled');
                    verifyBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    // Auto-trigger verification simulation
                    simulateVerification();
                } else {
                    verifyBtn.setAttribute('disabled', 'true');
                    verifyBtn.classList.add('opacity-50', 'cursor-not-allowed');
                }
            }

            function simulateVerification() {
                verifyBtn.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin">autorenew</span><span>Verifying...</span>';
                
                setTimeout(() => {
                    inputs.forEach(input => {
                        input.classList.add('success-animation');
                        input.style.borderColor = '#2d694d'; // secondary color for success
                        input.style.color = '#2d694d';
                    });
                    verifyBtn.innerHTML = '<span class="material-symbols-outlined text-[18px]">check_circle</span><span>Success</span>';
                    verifyBtn.classList.replace('bg-primary', 'bg-secondary');
                    verifyBtn.classList.replace('text-on-primary', 'text-on-secondary');
                }, 1500);
            }

            // Timer Logic
            let timeLeft = 59;
            const timerInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft >= 0) {
                    const seconds = timeLeft < 10 ? '0' + timeLeft : timeLeft;
                    timerDisplay.textContent = `0:${seconds}`;
                } else {
                    clearInterval(timerInterval);
                    timerDisplay.parentElement.innerHTML = '<button class="text-primary hover:underline font-medium">Resend Code</button>';
                }
            }, 1000);
            
            verifyBtn.addEventListener('click', simulateVerification);
        });
    </script>
