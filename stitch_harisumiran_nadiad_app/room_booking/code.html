<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Room Booking</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline": "#8b7268",
                        "surface-container-low": "#faf2ee",
                        "on-error-container": "#93000a",
                        "surface-variant": "#e8e1dd",
                        "surface": "#fff8f5",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed": "#360f00",
                        "on-secondary-fixed-variant": "#105137",
                        "primary-fixed": "#ffdbcd",
                        "secondary-fixed-dim": "#96d4b2",
                        "on-background": "#1e1b19",
                        "primary-container": "#b84d17",
                        "on-primary-container": "#ffeee9",
                        "on-secondary-container": "#326e51",
                        "inverse-primary": "#ffb597",
                        "on-secondary-fixed": "#002113",
                        "on-surface-variant": "#57423a",
                        "outline-variant": "#dec0b5",
                        "on-tertiary": "#ffffff",
                        "background": "#fff8f5",
                        "inverse-surface": "#33302e",
                        "secondary": "#2d694d",
                        "error-container": "#ffdad6",
                        "on-primary": "#ffffff",
                        "primary": "#963700",
                        "tertiary": "#1f5987",
                        "secondary-fixed": "#b1f0cd",
                        "surface-tint": "#a33e05",
                        "tertiary-fixed": "#cfe5ff",
                        "primary-fixed-dim": "#ffb597",
                        "on-surface": "#1e1b19",
                        "tertiary-fixed-dim": "#98cbff",
                        "tertiary-container": "#3c72a1",
                        "secondary-container": "#aeedca",
                        "surface-container": "#f4ece9",
                        "on-error": "#ffffff",
                        "surface-dim": "#e0d9d5",
                        "inverse-on-surface": "#f7efec",
                        "on-primary-fixed-variant": "#7e2c00",
                        "surface-container-highest": "#e8e1dd",
                        "error": "#ba1a1a",
                        "on-tertiary-container": "#eaf2ff",
                        "on-tertiary-fixed": "#001d33",
                        "on-tertiary-fixed-variant": "#024a77",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#eee7e3",
                        "surface-bright": "#fff8f5"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "touch-target-min": "44px",
                        "gutter": "16px",
                        "margin-main": "20px",
                        "unit": "8px",
                        "stack-gap": "12px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "gujarati-body": ["Noto Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "body-lg": ["Inter"],
                        "nav-large-title": ["Plus Jakarta Sans"],
                        "branding-header": ["Plus Jakarta Sans"],
                        "label-sm": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["15px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "gujarati-body": ["17px", { "lineHeight": "26px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "25px", "fontWeight": "600" }],
                        "body-lg": ["17px", { "lineHeight": "22px", "fontWeight": "400" }],
                        "nav-large-title": ["34px", { "lineHeight": "41px", "letterSpacing": "-0.4pt", "fontWeight": "700" }],
                        "branding-header": ["22px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-sm": ["13px", { "lineHeight": "18px", "letterSpacing": "0.2pt", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 0.5px solid rgba(232, 224, 216, 1);
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md antialiased min-h-screen pb-32">
<!-- Top Navigation (Standard Transactional Back Nav) -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl border-b border-outline-variant/30 h-touch-target-min flex justify-between items-center px-margin-main">
<button class="text-primary hover:opacity-80 transition-opacity flex items-center h-touch-target-min">
<span class="material-symbols-outlined mr-1 text-[24px]">chevron_left</span>
<span class="font-label-sm text-label-sm">Back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Book a Room</h1>
<div class="w-[60px]"></div> <!-- Spacer for center alignment -->
</header>
<main class="pt-[80px] px-margin-main max-w-[720px] mx-auto space-y-[32px]">
<!-- Date Picker Section -->
<section>
<h2 class="font-label-sm text-label-sm text-on-surface-variant mb-[8px] px-1 uppercase tracking-wider">Select Date</h2>
<div class="flex space-x-[12px] overflow-x-auto hide-scrollbar pb-2">
<!-- Days (Mon-Sun sample) -->
<button class="flex-none w-[60px] h-[80px] rounded-xl glass-panel flex flex-col items-center justify-center space-y-1 hover:bg-surface-variant/50 transition-colors">
<span class="font-label-sm text-label-sm text-on-surface-variant">Mon</span>
<span class="font-headline-md text-headline-md">12</span>
</button>
<button class="flex-none w-[60px] h-[80px] rounded-xl bg-primary text-on-primary flex flex-col items-center justify-center space-y-1 shadow-md shadow-primary/20 scale-105 transition-transform">
<span class="font-label-sm text-label-sm text-primary-fixed">Tue</span>
<span class="font-headline-md text-headline-md">13</span>
</button>
<button class="flex-none w-[60px] h-[80px] rounded-xl glass-panel flex flex-col items-center justify-center space-y-1 hover:bg-surface-variant/50 transition-colors">
<span class="font-label-sm text-label-sm text-on-surface-variant">Wed</span>
<span class="font-headline-md text-headline-md">14</span>
</button>
<button class="flex-none w-[60px] h-[80px] rounded-xl glass-panel flex flex-col items-center justify-center space-y-1 hover:bg-surface-variant/50 transition-colors">
<span class="font-label-sm text-label-sm text-on-surface-variant">Thu</span>
<span class="font-headline-md text-headline-md">15</span>
</button>
<button class="flex-none w-[60px] h-[80px] rounded-xl glass-panel flex flex-col items-center justify-center space-y-1 hover:bg-surface-variant/50 transition-colors">
<span class="font-label-sm text-label-sm text-on-surface-variant">Fri</span>
<span class="font-headline-md text-headline-md">16</span>
</button>
<button class="flex-none w-[60px] h-[80px] rounded-xl glass-panel flex flex-col items-center justify-center space-y-1 hover:bg-surface-variant/50 transition-colors">
<span class="font-label-sm text-label-sm text-on-surface-variant">Sat</span>
<span class="font-headline-md text-headline-md">17</span>
</button>
</div>
</section>
<!-- Room Selection -->
<section>
<h2 class="font-label-sm text-label-sm text-on-surface-variant mb-[8px] px-1 uppercase tracking-wider">Select Room</h2>
<div class="grid grid-cols-1 md:grid-cols-3 gap-[12px]">
<button class="glass-panel rounded-xl p-[16px] flex items-center justify-between border-primary/40 bg-primary/5 text-left transition-transform active:scale-95">
<div>
<h3 class="font-body-lg text-body-lg text-on-surface font-semibold">Main Hall</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1 flex items-center"><span class="material-symbols-outlined text-[16px] mr-1">group</span> Capacity: 200</p>
</div>
<span class="material-symbols-outlined text-primary text-[24px]">check_circle</span>
</button>
<button class="glass-panel rounded-xl p-[16px] flex items-center justify-between text-left transition-transform active:scale-95 hover:bg-surface-variant/30">
<div>
<h3 class="font-body-lg text-body-lg text-on-surface font-medium">Classroom 1</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1 flex items-center"><span class="material-symbols-outlined text-[16px] mr-1">chair_alt</span> Capacity: 30</p>
</div>
</button>
<button class="glass-panel rounded-xl p-[16px] flex items-center justify-between text-left transition-transform active:scale-95 hover:bg-surface-variant/30">
<div>
<h3 class="font-body-lg text-body-lg text-on-surface font-medium">Community Center</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1 flex items-center"><span class="material-symbols-outlined text-[16px] mr-1">festival</span> Capacity: 100</p>
</div>
</button>
</div>
</section>
<!-- Time Slots -->
<section>
<div class="flex justify-between items-end mb-[8px] px-1">
<h2 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Available Times</h2>
<span class="font-label-sm text-label-sm text-on-surface-variant">30-min increments</span>
</div>
<div class="glass-panel rounded-xl p-1 overflow-hidden">
<!-- Slot Grid -->
<div class="grid grid-cols-2 md:grid-cols-4 gap-[4px]">
<!-- Morning -->
<button class="h-touch-target-min rounded-lg flex items-center justify-center font-body-md text-body-md hover:bg-surface-variant/50 transition-colors">09:00 AM</button>
<button class="h-touch-target-min rounded-lg flex items-center justify-center font-body-md text-body-md hover:bg-surface-variant/50 transition-colors">09:30 AM</button>
<button class="h-touch-target-min rounded-lg flex items-center justify-center font-body-md text-body-md hover:bg-surface-variant/50 transition-colors">10:00 AM</button>
<button class="h-touch-target-min rounded-lg flex items-center justify-center font-body-md text-body-md hover:bg-surface-variant/50 transition-colors">10:30 AM</button>
<!-- Afternoon / Active Selection -->
<button class="h-touch-target-min rounded-lg flex items-center justify-center font-body-md text-body-md bg-primary text-on-primary shadow-sm shadow-primary/20">03:30 PM</button>
<!-- Conflict Slots -->
<button class="h-touch-target-min rounded-lg flex items-center justify-center font-body-md text-body-md bg-error-container/50 text-on-error-container border border-error/20 relative overflow-hidden group">
<span class="line-through opacity-70">04:00 PM</span>
<div class="absolute inset-0 bg-error-container flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-[18px]">warning</span>
</div>
</button>
<button class="h-touch-target-min rounded-lg flex items-center justify-center font-body-md text-body-md bg-error-container/50 text-on-error-container border border-error/20 relative overflow-hidden group">
<span class="line-through opacity-70">04:30 PM</span>
<div class="absolute inset-0 bg-error-container flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-[18px]">warning</span>
</div>
</button>
<button class="h-touch-target-min rounded-lg flex items-center justify-center font-body-md text-body-md bg-error-container/50 text-on-error-container border border-error/20 relative overflow-hidden group">
<span class="line-through opacity-70">05:00 PM</span>
<div class="absolute inset-0 bg-error-container flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-[18px]">warning</span>
</div>
</button>
<button class="h-touch-target-min rounded-lg flex items-center justify-center font-body-md text-body-md bg-error-container/50 text-on-error-container border border-error/20 relative overflow-hidden group">
<span class="line-through opacity-70">05:30 PM</span>
<div class="absolute inset-0 bg-error-container flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-[18px]">warning</span>
</div>
</button>
</div>
</div>
<!-- Inline Conflict Warning (Simulating state when 4 PM is tapped) -->
<div class="mt-[16px] p-[12px] rounded-lg bg-error-container/30 border border-error/20 flex items-start space-x-3">
<span class="material-symbols-outlined text-error mt-0.5" style="font-variation-settings: 'FILL' 1;">error</span>
<div>
<h4 class="font-body-md text-body-md text-on-error-container font-semibold">Double Booking Detected</h4>
<p class="font-label-sm text-label-sm text-error mt-1">Youth Group already booked 4 PM - 6 PM</p>
</div>
</div>
</section>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full glass-panel border-t border-outline-variant/30 px-margin-main py-[16px] pb-[safe-area-inset-bottom]">
<div class="max-w-[720px] mx-auto flex items-center justify-between">
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant">Selected</p>
<p class="font-body-md text-body-md text-on-surface font-semibold">Tue 13, 03:30 PM</p>
</div>
<!-- Disabled due to conflict -->
<button class="h-touch-target-min px-6 rounded-full bg-surface-variant text-on-surface-variant/50 font-body-md text-body-md font-semibold flex items-center opacity-70 cursor-not-allowed" disabled="">
                Request Booking
            </button>
</div>
</div>
</body></html>
