<!DOCTYPE html>

<html class="light" lang="en"><head>

<style>
        .liquid-glass {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .bottom-sheet {
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
        }
        .bottom-sheet.open {
            transform: translateY(0);
        }
        .step-transition {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .step-hidden {
            opacity: 0;
            pointer-events: none;
            position: absolute;
            transform: translateX(20px);
        }
        .step-visible {
            opacity: 1;
            pointer-events: auto;
            position: relative;
            transform: translateX(0);
        }
        /* Custom Checkbox */
        .custom-checkbox input:checked + div {
            background-color: theme('colors.primary');
            border-color: theme('colors.primary');
        }
        .custom-checkbox input:checked + div svg {
            display: block;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

  </head>
<body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Background Context (simulating main app behind sheet) -->
<div class="absolute inset-0 flex flex-col z-0 opacity-50 pointer-events-none">
<header class="bg-canvas/80 backdrop-blur-xl border-b-[0.5px] border-border-subtle flex items-center justify-between px-margin-main h-[60px] w-full sticky top-0">
<h1 class="font-branding-header text-branding-header text-primary">HariSumiran</h1>
</header>
<main class="flex-1 p-margin-main">
<div class="w-full h-32 bg-surface-container rounded-xl mb-4"></div>
<div class="w-full h-64 bg-surface-container rounded-xl"></div>
</main>
</div>
<!-- Trigger Button (For Demo) -->
<button class="z-10 bg-primary text-on-primary px-6 py-3 rounded-full font-label-sm text-label-sm shadow-md active:scale-95 transition-transform hidden" id="openSheetBtn">
        Open New Announcement
    </button>
<!-- Overlay -->
<div class="fixed inset-0 bg-black/40 z-40 opacity-0 transition-opacity duration-300 pointer-events-none" id="sheetOverlay"></div>
<!-- Bottom Sheet -->
<div class="bottom-sheet fixed bottom-0 left-0 right-0 z-50 bg-surface-container-lowest rounded-t-[32px] shadow-2xl flex flex-col max-h-[795px] h-[751px] w-full max-w-2xl mx-auto border-t border-surface-variant" id="announcementSheet">
<!-- Sheet Handle -->
<div class="w-full flex justify-center py-3 shrink-0 cursor-pointer" id="dragHandle">
<div class="w-12 h-1.5 bg-surface-variant rounded-full"></div>
</div>
<!-- Sheet Header -->
<div class="px-margin-main pb-4 flex items-center justify-between shrink-0 border-b border-surface-variant">
<button class="text-on-surface-variant font-label-sm text-label-sm hover:opacity-80 flex items-center h-touch-target-min" id="closeSheetBtn">
                Cancel
            </button>
<h2 class="font-headline-md text-headline-md text-on-surface" id="sheetTitle">New Announcement</h2>
<div class="w-16"></div> <!-- Spacer for balance -->
</div>
<!-- Content Area (Scrollable) -->
<div class="flex-1 overflow-y-auto px-margin-main py-6 relative">
<!-- STEP 1: Audience Builder -->
<div class="step-visible w-full" id="step1">
<!-- Live Recipient Count Banner -->
<div class="bg-secondary-container text-on-secondary-container rounded-xl p-4 mb-6 flex items-center justify-between shadow-sm">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined" data-weight="fill" style="font-variation-settings: 'FILL' 1;">groups</span>
<span class="font-body-lg text-body-lg font-medium">Estimated Reach</span>
</div>
<span class="font-headline-md text-headline-md">428</span>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant mb-4 uppercase tracking-wider">Select Audience Filters</p>
<div class="space-y-6">
<!-- Filter: Area -->
<div class="space-y-2">
<label class="font-body-md text-body-md font-medium text-on-surface">Area</label>
<select class="w-full h-[52px] bg-surface rounded-xl border border-outline-variant px-4 font-body-md text-on-surface focus:ring-2 focus:ring-primary focus:border-primary outline-none appearance-none bg-[url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%24%2024%22%20fill%3D%22none%22%20stroke%3D%22%2357423a%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E')] bg-no-repeat bg-[position:right_1rem_center] bg-[length:1.2em_1.2em]">
<option>All Areas</option>
<option>Zone 1, Nadiad</option>
<option>Zone 2, Nadiad</option>
<option>Zone 3, Nadiad</option>
<option selected="">Zone 4, Nadiad</option>
</select>
</div>
<!-- Filter: Role -->
<div class="space-y-2">
<label class="font-body-md text-body-md font-medium text-on-surface">Role</label>
<div class="flex flex-wrap gap-2">
<label class="custom-checkbox flex items-center gap-2 cursor-pointer bg-surface border border-outline-variant rounded-full px-4 py-2 hover:bg-surface-container-low transition-colors">
<input checked="" class="hidden" type="checkbox"/>
<span class="font-label-sm text-label-sm text-on-surface">Family Captains</span>
</label>
<label class="custom-checkbox flex items-center gap-2 cursor-pointer bg-surface border border-outline-variant rounded-full px-4 py-2 hover:bg-surface-container-low transition-colors">
<input class="hidden" type="checkbox"/>
<span class="font-label-sm text-label-sm text-on-surface">Mandal Leads</span>
</label>
<label class="custom-checkbox flex items-center gap-2 cursor-pointer bg-surface border border-outline-variant rounded-full px-4 py-2 hover:bg-surface-container-low transition-colors">
<input class="hidden" type="checkbox"/>
<span class="font-label-sm text-label-sm text-on-surface">Volunteers</span>
</label>
</div>
</div>
<!-- Filter: Department -->
<div class="space-y-2">
<label class="font-body-md text-body-md font-medium text-on-surface">Department</label>
<select class="w-full h-[52px] bg-surface rounded-xl border border-outline-variant px-4 font-body-md text-on-surface focus:ring-2 focus:ring-primary focus:border-primary outline-none appearance-none bg-[url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%24%2024%22%20fill%3D%22none%22%20stroke%3D%22%2357423a%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E')] bg-no-repeat bg-[position:right_1rem_center] bg-[length:1.2em_1.2em]">
<option>All Departments</option>
<option selected="">Kitchen Seva</option>
<option>Traffic Control</option>
<option>Decoration</option>
</select>
</div>
</div>
</div>
<!-- STEP 2: Composer -->
<div class="step-hidden w-full" id="step2">
<!-- Language Toggle -->
<div class="flex justify-end mb-4">
<div class="bg-surface-variant rounded-full p-1 flex">
<button class="px-4 py-1.5 rounded-full font-label-sm text-label-sm bg-surface-container-lowest text-on-surface shadow-sm" id="langEn">English</button>
<button class="px-4 py-1.5 rounded-full font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface" id="langGu">ગુજરાતી</button>
</div>
</div>
<div class="space-y-4">
<!-- Subject Field -->
<div>
<input class="w-full bg-transparent border-b border-outline-variant px-2 py-3 font-headline-md text-headline-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary focus:outline-none transition-colors" placeholder="Subject" type="text"/>
</div>
<!-- Message Body -->
<div>
<textarea class="w-full bg-surface-container-low rounded-xl border-none px-4 py-4 font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant/50 focus:ring-1 focus:ring-primary outline-none resize-none" placeholder="Write your announcement here..." rows="6"></textarea>
</div>
<!-- Channel Selection -->
<div class="pt-4">
<p class="font-label-sm text-label-sm text-on-surface-variant mb-3 uppercase tracking-wider">Send Via</p>
<div class="grid grid-cols-3 gap-3">
<label class="relative flex flex-col items-center justify-center p-3 rounded-xl border border-outline-variant bg-surface cursor-pointer hover:bg-surface-container-low transition-colors">
<input checked="" class="peer sr-only" type="checkbox"/>
<div class="absolute inset-0 rounded-xl border-2 border-transparent peer-checked:border-primary pointer-events-none"></div>
<span class="material-symbols-outlined text-primary mb-1" data-weight="fill" style="font-variation-settings: 'FILL' 1;">notifications</span>
<span class="font-label-sm text-label-sm text-on-surface">App</span>
</label>
<label class="relative flex flex-col items-center justify-center p-3 rounded-xl border border-outline-variant bg-surface cursor-pointer hover:bg-surface-container-low transition-colors">
<input checked="" class="peer sr-only" type="checkbox"/>
<div class="absolute inset-0 rounded-xl border-2 border-transparent peer-checked:border-primary pointer-events-none"></div>
<span class="material-symbols-outlined text-[#25D366] mb-1" data-weight="fill" style="font-variation-settings: 'FILL' 1;">chat</span>
<span class="font-label-sm text-label-sm text-on-surface">WhatsApp</span>
</label>
<label class="relative flex flex-col items-center justify-center p-3 rounded-xl border border-outline-variant bg-surface cursor-pointer hover:bg-surface-container-low transition-colors">
<input class="peer sr-only" type="checkbox"/>
<div class="absolute inset-0 rounded-xl border-2 border-transparent peer-checked:border-primary pointer-events-none"></div>
<span class="material-symbols-outlined text-tertiary mb-1">sms</span>
<span class="font-label-sm text-label-sm text-on-surface">SMS</span>
</label>
</div>
</div>
</div>
</div>
</div>
<!-- Sticky Bottom Actions -->
<div class="p-margin-main bg-surface-container-lowest border-t border-surface-variant shrink-0 flex gap-4">
<button class="hidden flex-1 h-14 rounded-full border border-outline-variant font-label-sm text-label-sm text-on-surface font-semibold hover:bg-surface-container-low transition-colors" id="backBtn">
                Back
            </button>
<button class="flex-1 h-14 rounded-full bg-primary text-on-primary font-label-sm text-label-sm font-semibold hover:opacity-90 active:scale-95 transition-all shadow-md" id="nextBtn">
                Continue to Compose
            </button>
<button class="hidden flex-[2] h-14 rounded-full bg-primary text-on-primary font-label-sm text-label-sm font-semibold hover:opacity-90 active:scale-95 transition-all shadow-md flex items-center justify-center gap-2" id="sendBtn">
<span class="material-symbols-outlined text-[18px]">send</span>
                Preview &amp; Send
            </button>
</div>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const sheet = document.getElementById('announcementSheet');
            const overlay = document.getElementById('sheetOverlay');
            const openBtn = document.getElementById('openSheetBtn');
            const closeBtn = document.getElementById('closeSheetBtn');
            
            const step1 = document.getElementById('step1');
            const step2 = document.getElementById('step2');
            const title = document.getElementById('sheetTitle');
            
            const nextBtn = document.getElementById('nextBtn');
            const backBtn = document.getElementById('backBtn');
            const sendBtn = document.getElementById('sendBtn');

            // Open/Close logic for demo purposes (auto-open on load)
            setTimeout(() => {
                openSheet();
            }, 100);

            openBtn.addEventListener('click', openSheet);
            closeBtn.addEventListener('click', closeSheet);
            overlay.addEventListener('click', closeSheet);

            function openSheet() {
                sheet.classList.add('open');
                overlay.classList.remove('pointer-events-none', 'opacity-0');
                overlay.classList.add('opacity-100');
            }

            function closeSheet() {
                sheet.classList.remove('open');
                overlay.classList.remove('opacity-100');
                overlay.classList.add('opacity-0', 'pointer-events-none');
                
                // Reset to step 1 after closing animation
                setTimeout(() => {
                    goToStep1();
                }, 400);
            }

            // Step Navigation
            nextBtn.addEventListener('click', goToStep2);
            backBtn.addEventListener('click', goToStep1);

            function goToStep2() {
                step1.classList.replace('step-visible', 'step-hidden');
                step2.classList.replace('step-hidden', 'step-visible');
                
                title.textContent = 'Compose Message';
                
                nextBtn.classList.add('hidden');
                backBtn.classList.remove('hidden');
                sendBtn.classList.remove('hidden');
            }

            function goToStep1() {
                step2.classList.replace('step-visible', 'step-hidden');
                step1.classList.replace('step-hidden', 'step-visible');
                
                title.textContent = 'New Announcement';
                
                nextBtn.classList.remove('hidden');
                backBtn.classList.add('hidden');
                sendBtn.classList.add('hidden');
            }

            // Language Toggle dummy interaction
            const langEn = document.getElementById('langEn');
            const langGu = document.getElementById('langGu');
            
            langEn.addEventListener('click', () => {
                langEn.classList.add('bg-surface-container-lowest', 'text-on-surface', 'shadow-sm');
                langEn.classList.remove('text-on-surface-variant');
                langGu.classList.remove('bg-surface-container-lowest', 'text-on-surface', 'shadow-sm');
                langGu.classList.add('text-on-surface-variant');
            });
            
            langGu.addEventListener('click', () => {
                langGu.classList.add('bg-surface-container-lowest', 'text-on-surface', 'shadow-sm');
                langGu.classList.remove('text-on-surface-variant');
                langEn.classList.remove('bg-surface-container-lowest', 'text-on-surface', 'shadow-sm');
                langEn.classList.add('text-on-surface-variant');
            });
        });
    </script>
</body></html>
