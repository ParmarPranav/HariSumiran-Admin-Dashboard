<style>
        .liquid-glass {
            background-color: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .liquid-glass-dark {
            background-color: rgba(30, 27, 25, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .card-shadow {
            box-shadow: 0 4px 12px rgba(36, 33, 31, 0.04);
        }
        body {
            background-color: #FBF9F5;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Modal Animation */
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased text-on-surface bg-background">
<!-- Top App Bar (Task-Focused - Close action) -->
<header class="fixed top-0 w-full z-50 liquid-glass border-b border-outline-variant/30 px-margin-main h-touch-target-min flex justify-between items-center">
<button class="flex items-center justify-center w-11 h-11 text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Asset Details</h1>
<div class="w-11 h-11"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="pt-[60px] pb-32 px-margin-main max-w-3xl mx-auto space-y-stack-gap">
<!-- Asset Image Hero -->
<div class="relative w-full aspect-square md:aspect-video rounded-2xl overflow-hidden bg-surface-container-high card-shadow border border-outline-variant/20 mt-unit">
<img class="object-cover w-full h-full" data-alt="A professional, well-lit photograph of a high-quality portable PA system resting on a clean, light-toned surface. The background is softly blurred to emphasize the speaker, displaying a serene and modern workspace aesthetic. The lighting is bright and warm, highlighting the texture of the speaker grille and controls." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB6Sei1AhgMciB3jjdi-ri_uWH7E8s50tBL3f091JDmnGAkc2R7MBPxHQ-dk9qAhOm-pwPYsYge8kMxWCc1z22mf4nftT9XlZwBHqzhRFEu3-mlY7Zv-9sjAhcn2YalMQRT5XvGlWj0b3eRkHk_adL5WEoy1UhS9Kw8dqtlcNTVOCwBZzU9j7tVh_PAPRTIyN8rLzdyEoLpVt7Qtcouasafdz0u4-dob4Oq_FNvpuqriAtFmmSJREUQ"/>
<!-- Floating Status Badge -->
<div class="absolute top-4 right-4 bg-surface-container-lowest/90 backdrop-blur-md px-3 py-1.5 rounded-full border border-secondary/20 flex items-center gap-1.5 shadow-sm">
<span class="w-2 h-2 rounded-full bg-secondary"></span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Available</span>
</div>
</div>
<!-- Title & QR Section -->
<div class="pt-unit pb-stack-gap">
<div class="flex items-start justify-between gap-4">
<div>
<h2 class="font-nav-large-title text-nav-large-title text-on-surface tracking-tight leading-tight">PA System #4</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-1">Portable Audio Equipment</p>
</div>
<div class="flex flex-col items-center bg-surface-container py-2 px-3 rounded-xl border border-outline-variant/30">
<span class="material-symbols-outlined text-on-surface-variant" style="font-size: 24px;">qr_code_2</span>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-1 tracking-wider">ASSET-8821</span>
</div>
</div>
</div>
<!-- Condition Notes Card -->
<div class="bg-surface-container-lowest rounded-2xl p-4 card-shadow border border-outline-variant/30">
<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">info</span>
<h3 class="font-headline-md text-headline-md text-on-surface text-[16px]">Condition Notes</h3>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">Battery at 80%, both mics checked and functioning properly. Cables included in the back pouch.</p>
</div>
<!-- Actions Container -->
<div class="grid grid-cols-2 gap-3 pt-unit">
<button class="col-span-2 w-full bg-primary text-on-primary py-4 rounded-xl font-headline-md text-headline-md text-[17px] active:scale-[0.98] transition-transform flex items-center justify-center gap-2 shadow-sm" onclick="document.getElementById('borrowSheet').classList.remove('translate-y-full'); document.getElementById('backdrop').classList.remove('opacity-0', 'pointer-events-none');">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add_shopping_cart</span>
                Borrow Asset
            </button>
<button class="col-span-2 w-full bg-surface-container-high text-on-surface py-3.5 rounded-xl font-headline-md text-headline-md text-[16px] active:scale-[0.98] transition-transform flex items-center justify-center gap-2 border border-outline-variant/30">
<span class="material-symbols-outlined text-on-surface-variant">report</span>
                Report Issue
            </button>
</div>
</main>
<!-- iOS System Sheet Overlay (Borrow Form) -->
<div class="fixed inset-0 bg-on-surface/20 backdrop-blur-sm z-50 opacity-0 pointer-events-none transition-opacity duration-300" id="backdrop" onclick="closeSheet()"></div>
<div class="fixed bottom-0 left-0 right-0 bg-surface-container-lowest rounded-t-[32px] z-50 transform translate-y-full transition-transform duration-300 cubic-bezier(0.32, 0.72, 0, 1) shadow-[0_-8px_30px_rgba(0,0,0,0.1)]" id="borrowSheet">
<!-- Drag Handle -->
<div class="w-full flex justify-center pt-3 pb-2 cursor-pointer" onclick="closeSheet()">
<div class="w-10 h-1.5 bg-outline-variant/50 rounded-full"></div>
</div>
<div class="px-margin-main pb-8 pt-2">
<div class="flex items-center justify-between mb-6">
<h3 class="font-headline-md text-headline-md text-on-surface">Borrow Details</h3>
<button class="w-8 h-8 flex items-center justify-center rounded-full bg-surface-container-high text-on-surface-variant active:scale-95 transition-transform" onclick="closeSheet()">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<form class="space-y-4">
<!-- Purpose Field -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1.5 ml-1">Purpose</label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant/60">description</span>
<input class="w-full bg-surface-container-high border-outline-variant/30 focus:border-primary focus:ring-1 focus:ring-primary rounded-xl py-3.5 pl-10 pr-4 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 transition-colors" placeholder="e.g. Bal Sabha Session" type="text"/>
</div>
</div>
<!-- Return Date Field -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1.5 ml-1">Return Date/Time</label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant/60">event</span>
<input class="w-full bg-surface-container-high border-outline-variant/30 focus:border-primary focus:ring-1 focus:ring-primary rounded-xl py-3.5 pl-10 pr-4 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 transition-colors" placeholder="e.g. Today, 8:00 PM" type="text"/>
</div>
</div>
<!-- Confirm Button -->
<div class="pt-4">
<button class="w-full bg-primary text-on-primary py-4 rounded-xl font-headline-md text-headline-md text-[17px] active:scale-[0.98] transition-transform shadow-sm" onclick="closeSheet()" type="button">
                        Confirm Borrow
                    </button>
</div>
</form>
</div>
</div>
<script>
        function closeSheet() {
            document.getElementById('borrowSheet').classList.add('translate-y-full');
            document.getElementById('backdrop').classList.add('opacity-0', 'pointer-events-none');
        }
    </script>
</body></html>
